    ];

    // --- Web Audio API 提示音效產生器 ---
    const playTone = (type) => {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        
        if (type === 'correct') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, ctx.currentTime);
          osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.1, ctx.currentTime);
          osc.start();
          osc.stop(ctx.currentTime + 0.2);
        } else if (type === 'wrong') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(300, ctx.currentTime);
          osc.frequency.setValueAtTime(200, ctx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.1, ctx.currentTime);
          osc.start();
          osc.stop(ctx.currentTime + 0.2);
        } else if (type === 'click') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(400, ctx.currentTime);
          gain.gain.setValueAtTime(0.05, ctx.currentTime);
          osc.start();
          osc.stop(ctx.currentTime + 0.05);
        }
      } catch (e) { console.log(e); }
    };

    // --- 共用 UI 元件 ---
    const BrutalContainer = ({ children, className = "" }) => (
      <div className={`border-[3px] border-black shadow-[4px_4px_0_0_#000] rounded-2xl ${className}`}>

    // --- 主應用程式元件 ---
    function App() {
      const [user, setUser] = useState({ classNum: '', seatNum: '', name: '' });
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [view, setView] = useState('learn'); 
      const [xp, setXp] = useState(0);
      const [level, setLevel] = useState(1);
      
      const [currentWordIndex, setCurrentWordIndex] = useState(0);
      const [quizList, setQuizList] = useState([]);
      const [quizIndex, setQuizIndex] = useState(0);

      // --- 後台資料庫 (Google Apps Script) 追蹤狀態 ---
      const GAS_WEB_APP_URL = '請貼上您的_Google_Apps_Script_部署網址'; // <--- ★ 部署時，請將您發布的 GAS 網址貼在這裡 ★
      const [sessionStartTime, setSessionStartTime] = useState(Date.now());
      const [sessionScore, setSessionScore] = useState(0);

      useEffect(() => {
        setLevel(Math.floor(xp / 50) + 1);
      }, [xp]);

      const handleLogin = (userData) => {
        setUser(userData);
        setCurrentWordIndex(0);
        setSessionScore(0);
        setSessionStartTime(Date.now());
        setIsLoggedIn(true);
      };

      const playAudio = (text) => {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        window.speechSynthesis.speak(utterance);
      };

      const sendRecordToGAS = (targetViewToRecord, isCompleted = false) => {
        if (!GAS_WEB_APP_URL || GAS_WEB_APP_URL.includes('請貼上')) return;

        const durationSecs = Math.round((Date.now() - sessionStartTime) / 1000);
        const mins = Math.floor(durationSecs / 60);
        const secs = durationSecs % 60;
        const durationStr = mins > 0 ? `${mins}分${secs}秒` : `${secs}秒`;

        let displayScore = targetViewToRecord === 'learn' ? `${sessionScore}題` : `${sessionScore}/15`;

        const payload = {
          classNum: user.classNum,
          seatNum: user.seatNum,
          name: user.name,
          mode: targetViewToRecord.toUpperCase(),
          score: displayScore,
          duration: durationStr,
          completed: isCompleted ? "Y" : "N"
        };

        fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        }).catch(err => console.error("GAS Error:", err));
      };

      const changeView = (newView) => {
        if (['learn', 'prospeak', 'spellit', 'fillin'].includes(view) && newView !== view) {
          const isCompleted = (view !== 'learn' && quizIndex >= 14);
          sendRecordToGAS(view, isCompleted);
        }

        if (['learn', 'prospeak', 'spellit', 'fillin'].includes(newView) && newView !== view) {
          setSessionScore(0);
          setSessionStartTime(Date.now());
        }

        setView(newView);
      };

      const startQuiz = (mode) => {
        const shuffled = [...vocabularyBank].sort(() => 0.5 - Math.random()).slice(0, 15);
        setQuizList(shuffled);
        setQuizIndex(0);
        changeView(mode);
      };

      const nextLearnWord = () => {
        setCurrentWordIndex((prev) => (prev + 1) % vocabularyBank.length);
      };

      const nextQuizQuestion = () => {
        if (quizIndex < 14) {
          setQuizIndex(quizIndex + 1);
        } else {
          showToast('測驗完成！', 'success');
          changeView('coach'); 
        }
      };

      const [toastMsg, setToastMsg] = useState(null);
      const showToast = (msg, type = 'success') => {
        setToastMsg({ text: msg, type });
        setTimeout(() => setToastMsg(null), 2000);
      };

      if (!isLoggedIn) {
        return <LoginScreen onLogin={handleLogin} />;
      }

      return (
        <div className="min-h-screen bg-[#fae8eb] p-4 font-sans text-black selection:bg-indigo-300 flex justify-center pb-20">
          <div className="w-full max-w-md flex flex-col gap-4">
            
            {toastMsg && (
              <div className={`fixed top-4 left-1/2 -translate-x-1/2 z-50 px-6 py-3 rounded-full font-bold border-2 border-black shadow-[4px_4px_0_0_#000] animate-bounce ${toastMsg.type === 'success' ? 'bg-green-400' : 'bg-red-400'}`}>
                {toastMsg.text}
              </div>
            )}

            <BrutalContainer className="bg-white flex justify-between items-center p-3">
              <div className="flex items-center gap-2">
                <div className="w-8 h-8 rounded-full bg-yellow-300 border-2 border-black flex items-center justify-center">
                  <Icons.Lightning />
                </div>
                <div>
                  <h1 className="font-black text-xl italic text-indigo-600 leading-none">VOCAB<span className="text-pink-500">POP</span></h1>
                  <p className="text-xs text-gray-500 font-bold">👤 {user.classNum}班 {user.seatNum}號 {user.name}</p>
                </div>
              </div>
              <div className="bg-black text-white px-3 py-1.5 rounded-full text-sm font-bold flex gap-2 items-center">
                <span className="text-yellow-400">★ LV.{level}</span>
                <span className="text-gray-400">|</span>
                <span>{xp} XP</span>
              </div>
            </BrutalContainer>

            {['learn', 'coach'].includes(view) && (
              <div className="flex gap-4">
                <BrutalButton onClick={() => changeView('learn')} className={`flex-1 py-3 flex items-center justify-center gap-2 text-lg ${view === 'learn' ? 'bg-[#93c5fd]' : 'bg-white'}`}>
                  <Icons.Book /> LEARN
                </BrutalButton>
                <BrutalButton onClick={() => changeView('coach')} className={`flex-1 py-3 flex items-center justify-center gap-2 text-lg ${view === 'coach' ? 'bg-[#fbcfe8]' : 'bg-white'}`}>
                  <Icons.Brain /> COACH
                </BrutalButton>
              </div>
            )}

            {!['learn', 'coach'].includes(view) && (
              <div className="flex justify-between items-center">
                <BrutalButton onClick={() => changeView('coach')} className="bg-white px-4 py-2 flex items-center gap-2 text-sm">
                  <Icons.Exit /> EXIT
                </BrutalButton>
                <div className="bg-white border-2 border-black font-black px-4 py-1 rounded-full text-sm shadow-[2px_2px_0_0_#000]">
                  {quizIndex + 1} / 15
                </div>
              </div>
            )}

            <div className="flex-1 mt-2 flex flex-col">
              {view === 'learn' && <LearnMode data={vocabularyBank[currentWordIndex]} playAudio={playAudio} onNext={nextLearnWord} onScore={() => {setXp(xp + 10); setSessionScore(s => s + 1); showToast('+10 XP!');}} />}
              {view === 'coach' && <CoachMenu startQuiz={startQuiz} />}
              {view === 'prospeak' && <ProSpeakMode data={quizList[quizIndex]} playAudio={playAudio} onNext={nextQuizQuestion} onScore={() => {setXp(xp + 15); setSessionScore(s => s + 1); showToast('+15 XP!');}} />}
              {view === 'spellit' && <SpellItMode data={quizList[quizIndex]} playAudio={playAudio} onNext={nextQuizQuestion} onScore={() => {setXp(xp + 20); setSessionScore(s => s + 1); showToast('+20 XP!');}} />}
              {view === 'fillin' && <FillInMode data={quizList[quizIndex]} onNext={nextQuizQuestion} onScore={() => {setXp(xp + 20); setSessionScore(s => s + 1); showToast('+20 XP!');}} />}
            </div>
          </div>
        </div>
      );
    }

    // --- 登入畫面元件 ---
    function LoginScreen({ onLogin }) {
      const [classNum, setClassNum] = useState('208');
      const [seatNum, setSeatNum] = useState('');
      const [name, setName] = useState('');

      const handleSubmit = (e) => {
        e.preventDefault();
        if (classNum && seatNum && name) {
          onLogin({ classNum, seatNum, name });

      };

      return (
        <div className="min-h-screen bg-[#fae8eb] flex items-center justify-center p-4">
          <BrutalContainer className="bg-white w-full max-w-sm p-8 flex flex-col items-center gap-6">
            <div className="w-20 h-20 bg-[#fde047] rounded-full border-4 border-black flex items-center justify-center shadow-[4px_4px_0_0_#000]">
              <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
            </div>
            <div className="text-center">
              <h1 className="text-4xl font-black italic text-indigo-600 mb-1">VOCAB<span className="text-pink-500">POP</span></h1>
              <h2 className="font-bold text-gray-500 tracking-wider">STUDENT LOGIN</h2>
            </div>

            <form onSubmit={handleSubmit} className="w-full flex flex-col gap-4 mt-2">
              <div className="flex gap-4">
                <div className="flex-1">
                  <label className="block font-bold text-sm mb-1 text-gray-700">CLASS (班級) *</label>
                  <select 
                    value={classNum} 
                    onChange={e => setClassNum(e.target.value)}
                    className="w-full border-2 border-black rounded-lg p-3 font-bold bg-white focus:outline-none focus:ring-2 focus:ring-indigo-400"
                  >
                    <option value="208">208</option>
                    <option value="211">211</option>
                    <option value="216">216</option>
                  </select>
                </div>
                <div className="flex-1">
                  <label className="block font-bold text-sm mb-1 text-gray-700">NO. (座號) *</label>
                  <input 
                    type="number" 
                    placeholder="e.g. 15" 
                    required
                    value={seatNum}
                    onChange={e => setSeatNum(e.target.value)}
                    className="w-full border-2 border-black rounded-lg p-3 font-bold outline-none focus:ring-2 focus:ring-indigo-400"
                  />

              </div>
              <div>
                <label className="block font-bold text-sm mb-1 text-gray-700">NAME (姓名) *</label>
                <input 
                  type="text" 
                  placeholder="e.g. 王小明" 
                  required
                  value={name}
                  onChange={e => setName(e.target.value)}
                  className="w-full border-2 border-black rounded-lg p-3 font-bold outline-none focus:ring-2 focus:ring-indigo-400"
                />
              </div>
              <BrutalButton type="submit" className="bg-[#6366f1] text-white py-4 mt-4 text-xl tracking-wide flex justify-center items-center gap-2">
                START JOURNEY <span className="text-2xl leading-none">→</span>
              </BrutalButton>
            </form>
          </BrutalContainer>
        </div>
      );
    }

    // --- 學習模式 (Learn Mode) ---
    function LearnMode({ data, playAudio, onNext, onScore }) {
      const [cards, setCards] = useState([]);
      const [selectedCards, setSelectedCards] = useState([]);
      const [matchedIds, setMatchedIds] = useState([]);
      const topRef = useRef(null);
      
      useEffect(() => {
        // 每次切換到新單字時，捲動回頁面最上方（顯示單字本身，而非搭配詞區塊）
        // 用 requestAnimationFrame 確保在畫面完成重新渲染、版面高度更新後才捲動，避免捲動失效
        requestAnimationFrame(() => {
          if (topRef.current) {
            topRef.current.scrollIntoView({ behavior: 'auto', block: 'start' });
          }
          window.scrollTo({ top: 0, left: 0, behavior: 'auto' });
        });

        playAudio(data.word);
        
        const initialCards = [];
        data.matchPairs.forEach((pair, idx) => {
          initialCards.push({ text: pair.en, type: 'en', id: idx });
          initialCards.push({ text: pair.zh, type: 'zh', id: idx });
        });
        
        setCards(initialCards.sort(() => 0.5 - Math.random()));
        setSelectedCards([]);
        setMatchedIds([]);
      }, [data]);

      const handleCardClick = (card) => {
        if (matchedIds.includes(card.id)) return; 
        if (selectedCards.some(c => c.text === card.text)) return; 
        if (selectedCards.length === 2) return; 

        const newSelected = [...selectedCards, card];
        setSelectedCards(newSelected);

        if (newSelected.length === 1) {
          playTone('click');
          if (card.type === 'en') playAudio(card.text);
        } else if (newSelected.length === 2) {
          if (newSelected[0].id === newSelected[1].id && newSelected[0].type !== newSelected[1].type) {
            playTone('correct');
            const newMatchedCount = matchedIds.length + 1;
            setMatchedIds(prev => [...prev, newSelected[0].id]);
            setSelectedCards([]);
            
            if (newMatchedCount === data.matchPairs.length) {
               onScore(); 
            }
          } else {
            playTone('wrong');
            setTimeout(() => setSelectedCards([]), 800);
          }
        }
      };

      return (
        <BrutalContainer className="bg-white overflow-hidden flex flex-col mb-4 h-full">
          <div ref={topRef}></div>
          <div className="bg-[#4f46e5] text-white p-6 pb-8 relative flex flex-col items-center text-center">
            <div className="absolute inset-0 opacity-20 pointer-events-none" style={{ backgroundImage: 'radial-gradient(#ffffff 2px, transparent 2px)', backgroundSize: '16px 16px' }}></div>
            
            <div className="bg-black text-white text-xs font-bold px-3 py-1 rounded-full self-start mb-4 relative z-10 border-2 border-white">
              {data.pos}
            </div>
            
            <div className="bg-white/20 px-3 py-1 rounded-md text-sm font-mono tracking-widest mb-2 relative z-10">
              {data.kk}
            </div>
            
            <h2 className="text-5xl font-black mb-4 relative z-10 tracking-tight">{data.word}</h2>
            
            <div className="flex gap-2 mb-6 relative z-10 flex-wrap justify-center">
              {data.syllables.map((syl, i) => (
                <span 
                  key={i} 
                  className={`px-3 py-1 rounded text-sm font-bold shadow-sm transition-all ${
                    data.stressIndex === i 
                      ? 'bg-yellow-400 text-black border-[2px] border-black shadow-[2px_2px_0_0_#000] scale-110 z-10' 
                      : 'bg-white/30 text-white border-[2px] border-transparent'
                  }`}
                >
                  {syl}
                </span>
              ))}
            </div>

            <button 
              onClick={() => { playTone('click'); playAudio(data.word); }}
              className="bg-white text-black w-16 h-16 rounded-full flex items-center justify-center border-[3px] border-black shadow-[4px_4px_0_0_#000] hover:translate-y-[2px] hover:shadow-[2px_2px_0_0_#000] active:translate-y-[4px] active:shadow-none transition-all relative z-10"
            >
              <Icons.Volume />
            </button>
          </div>

          <div className="p-6 flex flex-col gap-6 flex-1">
            <div>
              <h3 className="font-black text-xl flex items-center gap-2 mb-2">
                <span className="w-3 h-3 bg-yellow-400 rounded-full border-2 border-black inline-block"></span> 
                Meaning
              </h3>
              <p className="text-gray-700 font-medium pl-4 border-l-[3px] border-gray-200 text-lg">
                {data.meaning} <span className="text-indigo-600 font-bold ml-1">({data.chinese})</span>
              </p>
            </div>

            {data.wordFamily !== "-" && (
              <div className="bg-indigo-50 border-2 border-indigo-200 rounded-xl p-4">
                <p className="text-indigo-600 font-bold text-sm mb-2 uppercase tracking-wide">🔗 Word Family & Collocations:</p>
                <div className="flex flex-col gap-2">
                   <div className="bg-white border border-indigo-200 rounded-lg px-3 py-2 text-sm font-medium text-gray-800">
                     {data.wordFamily}
                   </div>
                   <div className="bg-white border border-indigo-200 rounded-lg px-3 py-2 text-sm font-bold text-indigo-700 italic flex justify-between">
                     " {data.matchPairs[0].en} "
                   </div>
                </div>
              </div>
            )}

            <div>
              <h3 className="font-black text-xl flex items-center gap-2 mb-2">
                <span className="w-3 h-3 bg-green-400 rounded-full border-2 border-black inline-block"></span> 
                Example
              </h3>
              <div className="bg-gray-50 border-2 border-gray-200 rounded-xl p-4 flex flex-col gap-2">
                <span className="text-gray-700 italic text-base leading-relaxed">"{data.example}"</span>
                <span className="text-indigo-700 font-bold text-sm border-t-2 border-gray-200 pt-2">{data.exampleChinese}</span>
              </div>
            </div>

            {/* 6 格中英搭配詞配對 Mini Match（3 組 Oxford Collocation Dictionary 常見搭配詞） */}
            <div className="bg-pink-50 border-2 border-pink-200 rounded-xl p-4 mt-2 mb-4">
              <h4 className="font-bold text-pink-600 mb-1 flex items-center gap-2">✨ Mini Match (中英搭配詞)</h4>
              <p className="text-sm font-bold text-gray-700 mb-3">請將下方的英文與對應的中文配對：</p>
              
              <div className="grid grid-cols-2 gap-3">
                {cards.map((card, i) => {
                  const isSelected = selectedCards.some(c => c.text === card.text);
                  const isMatched = matchedIds.includes(card.id);
                  
                  let btnClass = "bg-white text-gray-800 border-pink-200 hover:bg-pink-100";
                  if (isMatched) {
                    btnClass = "bg-green-400 text-black border-black border-2 shadow-[2px_2px_0_0_#000] opacity-60 cursor-not-allowed";
                  } else if (isSelected) {
                    btnClass = "bg-yellow-300 text-black border-black border-2 shadow-[2px_2px_0_0_#000]";
                  }

                  return (
                    <button 
                      key={i}
                      onClick={() => handleCardClick(card)}
                      className={`p-4 rounded-lg font-bold text-[13px] transition-all border-2 ${btnClass}`}
                    >
                      {card.text}
                    </button>
                  );
                })}
              </div>
            </div>
          </div>

          <div className="p-4 pt-0 w-full mt-auto">
            <BrutalButton onClick={(e) => { if (e && e.currentTarget) e.currentTarget.blur(); onNext(); }} className="w-full bg-black text-white py-4 text-lg shadow-[4px_4px_0_0_#cbd5e1] hover:bg-gray-800">
              NEXT WORD →
            </BrutalButton>
          </div>
        </BrutalContainer>
      );
    }

    // --- 教練模式選單 (Coach Menu) ---
    function CoachMenu({ startQuiz }) {
      return (
        <div className="flex flex-col gap-4">
          <BrutalButton onClick={() => startQuiz('prospeak')} className="bg-[#86efac] p-6 flex flex-col items-center justify-center gap-2">
            <Icons.Mic />
            <span className="font-black text-2xl">PRO SPEAK</span>
            <span className="text-sm font-bold text-gray-800">發音挑戰 (隨機 15 題)</span>
          </BrutalButton>
          
          <BrutalButton onClick={() => startQuiz('spellit')} className="bg-[#a5b4fc] p-6 flex flex-col items-center justify-center gap-2">
            <Icons.Keyboard />
            <span className="font-black text-2xl">SPELL IT</span>
            <span className="text-sm font-bold text-gray-800">課本單字聽寫 (隨機 15 題)</span>
          </BrutalButton>
          
          <BrutalButton onClick={() => startQuiz('fillin')} className="bg-[#fdba74] p-6 flex flex-col items-center justify-center gap-2 relative overflow-hidden">
            <div className="absolute top-0 right-0 w-16 h-16 bg-orange-400 rounded-bl-full opacity-50"></div>
            <Icons.Pen />
            <span className="font-black text-2xl relative z-10">FILL IN</span>
            <span className="text-sm font-bold text-gray-800 relative z-10">單字克漏字 (隨機 15 題)</span>
          </BrutalButton>
        </div>
      );
    }

    // --- 發音挑戰 (Pro Speak) ---
    function ProSpeakMode({ data, playAudio, onNext, onScore }) {
      const [status, setStatus] = useState('idle');
      const [transcript, setTranscript] = useState('');

      const handleListen = () => {
        playTone('click');
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          setStatus('error');
          setTranscript('瀏覽器不支援，請使用 Chrome 或允許麥克風權限。');
          return;
        }

        const recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        recognition.onstart = () => {
          setStatus('listening');
          setTranscript('');
        };

        recognition.onresult = (event) => {
          const speechResult = event.results[0][0].transcript.toLowerCase().trim();
          setTranscript(speechResult);
          const cleanResult = speechResult.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g,"");
          const cleanTarget = data.word.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g,"");
          
          if (cleanResult.includes(cleanTarget) || cleanTarget.includes(cleanResult)) {
            playTone('correct');
            setStatus('success');
            onScore();
          } else {
            playTone('wrong');
            setStatus('error');
          }
        };

        recognition.onerror = (event) => {
          setStatus('error');
          if (event.error === 'not-allowed') {
            setTranscript('麥克風權限被拒絕，請允許權限或點擊跳過。');
          } else {
            setTranscript('發生錯誤: ' + event.error);
          }
        };

        recognition.onend = () => {
          if(status === 'listening') setStatus('idle');
        };

        recognition.start();
      };

      return (
        <BrutalContainer className="bg-white p-6 flex flex-col items-center text-center min-h-[400px]">
          <div className="self-end bg-gray-200 px-3 py-1 rounded-full text-sm font-bold mb-4">
            VOCAB <span className="text-indigo-600">PRO</span>
          </div>
          
          <h2 className="text-5xl font-black mt-8 mb-4">{data.word}</h2>
          <div className="bg-gray-100 px-4 py-2 rounded-lg font-mono text-lg tracking-widest mb-12 border-2 border-gray-300">
            {data.kk}
          </div>

          <button 
            onClick={handleListen}
            className={`w-32 h-32 rounded-full border-[4px] border-black shadow-[6px_6px_0_0_#000] flex items-center justify-center transition-all 
              ${status === 'listening' ? 'bg-red-400 animate-pulse translate-y-[2px] shadow-[4px_4px_0_0_#000]' : 'bg-[#fde047] hover:bg-yellow-300'}
            `}
          >
            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
          </button>

          <div className="mt-8 font-bold text-lg min-h-[2rem]">
            {status === 'listening' && <span className="text-red-500">Listening...</span>}
            {status === 'success' && <span className="text-green-500">Excellent! ({transcript})</span>}
            {status === 'error' && <span className="text-red-500">{transcript.includes('瀏覽器') || transcript.includes('權限') || transcript.includes('錯誤') ? transcript : `Heard: "${transcript}". Try again!`}</span>}
            {status === 'idle' && <span>TAP TO RECORD</span>}
          </div>

          <div className="mt-auto w-full pt-6 flex flex-col gap-3">
            {status === 'success' ? (
              <BrutalButton onClick={() => {setStatus('idle'); onNext();}} className="w-full bg-black text-white py-4 text-lg">
                NEXT QUESTION →
              </BrutalButton>
            ) : (
              <button onClick={() => {setStatus('idle'); onNext();}} className="text-gray-400 text-sm font-bold hover:text-gray-600 underline py-2">
                無法使用麥克風？點此跳過此題
              </button>
            )}
          </div>
        </BrutalContainer>
      );
    }

    // --- 聽寫測驗 (Spell It) ---
    function SpellItMode({ data, playAudio, onNext, onScore }) {
      const [input, setInput] = useState('');
      const [status, setStatus] = useState('idle');

      useEffect(() => {
        playAudio(data.word);
        setInput('');
        setStatus('idle');
      }, [data]);

      const handleCheck = () => {
        if (input.toLowerCase().trim() === data.word.toLowerCase()) {
          playTone('correct');
          setStatus('success');
          onScore();
        } else {
          playTone('wrong');
          setStatus('error');
        }
      };

      return (
        <BrutalContainer className="bg-[#fff7ed] p-6 flex flex-col items-center text-center">
          <div className="w-full flex justify-end mb-4">
            <span className="bg-gray-200 px-3 py-1 rounded-full text-sm font-bold text-gray-600">DICTATION</span>
          </div>

          <button 
            onClick={() => { playTone('click'); playAudio(data.word); }}
            className="w-24 h-24 bg-[#a5b4fc] rounded-full border-[3px] border-black shadow-[4px_4px_0_0_#000] flex items-center justify-center mb-8 hover:bg-indigo-300 transition-colors hover:translate-y-[2px] active:translate-y-[4px] active:shadow-none"
          >
            <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
          </button>

          <p className="text-lg font-bold text-gray-800 mb-4 px-4 border-l-4 border-indigo-400 text-left w-full">
            "{data.meaning}" <br/>
            <span className="text-indigo-600 text-sm mt-1 block">({data.chinese})</span>
          </p>

          <div className="bg-black text-white px-4 py-1 rounded-full text-sm font-bold mb-8">
            {data.pos} • {data.word.length} letters/chars
          </div>

          <input
            type="text"
            value={input}
            onChange={(e) => {setInput(e.target.value); setStatus('idle');}}
            placeholder="Type here..."
            className={`w-full text-center text-3xl font-black p-4 bg-transparent border-b-4 outline-none transition-colors 
              ${status === 'error' ? 'border-red-500 text-red-600' : 'border-indigo-500 text-indigo-900'}
            `}
          />
          {status === 'error' && <p className="text-red-500 font-bold mt-2">Try again!</p>}

          <div className="mt-12 w-full">
            {status === 'success' ? (
              <BrutalButton onClick={onNext} className="w-full bg-green-400 py-4 text-xl">
                CORRECT! NEXT →
              </BrutalButton>
            ) : (
              <BrutalButton onClick={handleCheck} className="w-full bg-black text-white py-4 text-xl">
                CHECK ANSWER
              </BrutalButton>
            )}
          </div>
        </BrutalContainer>
      );
    }

    // 從字典字根 (data.word，可能包含 "..." 表示片語省略部分) 取出可比對的基礎詞形
    function getBaseTokens(baseWordField) {
      return baseWordField
        .replace(/\.\.\./g, ' ')
        .split(/\s+/)
        .filter(Boolean);
    }

    // 比對此字與所有基礎詞形，找出最長共同字首，藉此推算出「時態/型態變化」的字尾，
    // 並完整顯示該字尾（字母數不限），讓學生能清楚看出變化規則（如 -ed、-s、-es、-ing 等）
    function buildBlank(word, baseTokens) {
      const lw = word.toLowerCase();

      if (word.length <= 2) {
        // 太短的字直接全部挖空
        return "_ ".repeat(word.length).trim();
      }

      let bestPrefixLen = 0;
      baseTokens.forEach(bt => {
        const lbt = bt.toLowerCase();
        let len = 0;
        const maxLen = Math.min(lw.length, lbt.length);
        while (len < maxLen && lw[len] === lbt[len]) len++;
        if (len > bestPrefixLen) bestPrefixLen = len;
      });

      const suffixLen = word.length - bestPrefixLen;

      if (bestPrefixLen >= 1 && suffixLen >= 1) {
        // 找到與字典原形不同的字尾變化，完整顯示該字尾
        const middleLen = word.length - 1 - suffixLen;
        const suffix = word.slice(word.length - suffixLen).split('').join(' ');
        return word[0] + (middleLen > 0 ? ' ' + "_ ".repeat(middleLen).trim() : '') + ' ' + suffix;
      }

      // 沒有偵測到字尾變化（與字典原形相同），僅保留字首與字尾各一個字母
      return word[0] + ' ' + "_ ".repeat(Math.max(word.length - 2, 0)).trim() + ' ' + word[word.length - 1];
    }

    // --- 填充測驗 (Fill In) 支援片語拆解 ---
    function FillInMode({ data, onNext, onScore }) {
      const [input, setInput] = useState('');
      const [status, setStatus] = useState('idle');
      const [showHint, setShowHint] = useState(false);

      useEffect(() => {
        setInput('');
        setStatus('idle');
        setShowHint(false);
      }, [data]);

      const targetWord = data.targetInExample;
      const baseTokens = getBaseTokens(data.word);
      const blankStr = targetWord.split(' ').map(w => buildBlank(w, baseTokens)).join('   ');

      const parts = data.example.split(new RegExp(`\\b${targetWord}\\b`, 'i'));
      const renderPrefix = parts[0] !== undefined ? parts[0] : "";
      const renderSuffix = parts[1] !== undefined ? parts[1] : "";

      const handleCheck = () => {
        if (input.toLowerCase().trim() === targetWord.toLowerCase()) {
          playTone('correct');
          setStatus('success');
          onScore();
        } else {
          playTone('wrong');
          setStatus('error');
        }
      };

      return (
        <BrutalContainer className="bg-white p-6">
          <div className="flex justify-between items-center mb-6">
            <span className="bg-pink-100 text-pink-700 border-2 border-pink-300 px-3 py-1 rounded-md text-sm font-bold shadow-sm">
              Grammar & Collocation
            </span>
            <span className="text-gray-400 font-bold text-sm">FILL IN</span>
          </div>

          <div className="text-2xl font-medium leading-relaxed mb-8 text-gray-800">
            {renderPrefix}
            <span className="inline-block mx-2 border-b-4 border-black px-2 pb-1 font-mono font-bold text-orange-500 bg-orange-50 relative top-1">
              {blankStr}
            </span>
            {renderSuffix}
          </div>

          <button 
            onClick={() => { playTone('click'); setShowHint(!showHint); }}
            className="text-blue-600 font-bold text-sm hover:underline mb-4"
          >
            {showHint ? "Hide Translation (Hint)" : "Show Translation (Hint)"}
          </button>

          {showHint && (
            <div className="bg-blue-50 border-l-4 border-blue-400 p-3 mb-6 text-gray-700 font-medium rounded-r-lg text-sm">
               中譯提示：{data.exampleChinese}
            </div>
          )}

          <div className="mt-4">
            <input
              type="text"
              value={input}
              onChange={(e) => {setInput(e.target.value); setStatus('idle');}}
              placeholder="Type the missing part..."
              className={`w-full border-2 border-black rounded-xl p-4 text-xl font-bold outline-none focus:ring-4 focus:ring-orange-200 transition-all shadow-[4px_4px_0_0_#000]
                ${status === 'error' ? 'bg-red-50 text-red-600 border-red-500' : 'bg-white text-black'}
              `}
            />
          </div>
          
          {status === 'error' && <p className="text-red-500 font-bold mt-3 text-center">Incorrect, check your spelling!</p>}

          <div className="mt-8">
            {status === 'success' ? (
              <BrutalButton onClick={onNext} className="w-full bg-green-400 py-4 text-xl">
                AWESOME! NEXT →
              </BrutalButton>
            ) : (
              <BrutalButton onClick={handleCheck} className="w-full bg-black text-white py-4 text-xl">
                CHECK ANSWER
              </BrutalButton>
            )}
          </div>
        </BrutalContainer>
      );
    }

    // 將 App 渲染到 DOM 中
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
